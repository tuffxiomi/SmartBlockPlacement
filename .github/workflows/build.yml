name: Build SmartBlockPlacement

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Build
        run: xmake -y

      - name: Verify package
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p = Path('build/android/arm64-v8a/release/SmartBlockPlacement.levipack')
          assert p.is_file(), p
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert names == {'manifest.json', 'libSmartBlockPlacement.so', 'icon.png'}, names
              manifest = json.loads(z.read('manifest.json'))
              assert manifest['name'] == 'SmartBlockPlacement'
              assert manifest['entry'] == 'libSmartBlockPlacement.so'
          print(p)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartBlockPlacement-levipack
          path: build/android/arm64-v8a/release/SmartBlockPlacement.levipack
          if-no-files-found: error
